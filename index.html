<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onlayn Shaxmat</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#0b0b0b;font-family:system-ui,Arial,sans-serif;background:conic-gradient(#fafafa 25%,#0b0b0b 0 50%,#fafafa 0 75%,#0b0b0b 0) 0 0/80px 80px}
header{padding:10px 14px;display:flex;gap:8px}
.tag{background:#0b0b0b;color:#fafafa;border:2px solid #fafafa;border-radius:10px;padding:8px 14px;font-weight:700}
main{max-width:520px;margin:0 auto;padding:6px 14px 30px}
.card{background:#fafafa;border:3px solid #0b0b0b;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:22px}
button,input{font:inherit;border-radius:8px;padding:10px 12px;border:2px solid #0b0b0b;background:#fafafa;color:#0b0b0b;cursor:pointer}
button.p{background:#0b0b0b;color:#fafafa}
input{cursor:text;text-transform:uppercase;letter-spacing:2px;width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row input{flex:1;min-width:0}
.bd{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:3px solid #000}
.sq{display:flex;align-items:center;justify-content:center;background:#eee;font-size:min(8vw,42px);line-height:1;position:relative;cursor:pointer;user-select:none}
.sq.d{background:#6d6d6d}.sq.s{outline:4px solid #000;outline-offset:-4px}
.sq.m::after{content:"";width:28%;height:28%;border-radius:50%;background:#e22;position:absolute}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000}.pk{color:#000}
.clk{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.hid{display:none}
</style></head><body>
<header><div class="tag" id="rt">Ball: 0</div><div class="tag" id="rg">Reyting: 200</div></header>
<main>
<div class="card"><h1>♞ Onlayn Shaxmat</h1><div id="msg">Ulanmoqda…</div></div>
<div class="card" id="home">
<button class="p" id="rnd">Tasodifiy rakib</button>
<button id="mk">Xona yaratish (ID olish)</button>
<div class="row"><input id="ic" maxlength="6" placeholder="Xona ID"><button class="p" id="jn">Qo’shilish</button></div>
</div>
<div class="card hid" id="play">
<div class="row"><b id="ti"></b><button id="lv">← Chiqish</button></div>
<div class="row"><span>Rakib: <span class="clk" id="c1">10:00</span></span><span>Siz: <span class="clk" id="c2">10:00</span></span></div>
<div class="bd" id="bd"></div><b id="st"></b>
</div>
</main>
<script>
const $=i=>document.getElementById(i),G={K:"♚",Q:"♛",R:"♜",B:"♝",N:"♞",P:"♟"};
let pid;try{pid=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2,12))}catch(e){pid=Math.random().toString(36).slice(2,12)}
let g=null,sel=null,at=0;
const msg=t=>$("msg").textContent=t;
const post=async(p,b={})=>{try{const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pid,...b})});const j=await r.json();if(j.err)msg(j.err);return j}catch(e){msg("Server bilan aloqa yo’q");return{}}};
const es=new EventSource("/events?pid="+pid);
es.onopen=()=>msg("Onlayn — o’ynashga tayyor");es.onerror=()=>msg("Ulanmoqda…");
es.addEventListener("me",e=>{const m=JSON.parse(e.data);$("rt").textContent="Ball: "+m.balls;$("rg").textContent="Reyting: "+m.rating});
es.addEventListener("game",e=>{g=JSON.parse(e.data);at=Date.now();sel=null;$("home").classList.add("hid");$("play").classList.remove("hid");render()});
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function tick(){if(!g)return;const el=Date.now()-at,l={...g.left};if(g.joined&&!g.over)l[g.turn]=Math.max(0,l[g.turn]-el);
const me=g.my||"w",op=me==="w"?"b":"w";$("c1").textContent=fmt(l[op]);$("c2").textContent=fmt(l[me])}
setInterval(tick,250);
function render(){const me=g.my,flip=me==="b";$("ti").textContent="ID: "+g.id+" · "+(me==="w"?"oq":"qora");
let s;if(!g.joined)s="Rakib kutilmoqda… ID ni do’stingizga yuboring: "+g.id;
else if(g.over)s=g.over==="d"?"Durang.":g.over===me?"Siz yutdingiz! +50 reyting, +1000 ball":"Siz yutqazdingiz.";
else s=g.turn===me?"Sizning navbat":"Rakib o’ylamoqda…";$("st").textContent=s;
const L=sel!=null?g.legal.filter(m=>m[0]===sel).map(m=>m[1]):[];let h="";
for(let k=0;k<64;k++){const i=flip?63-k:k,p=g.board[i],d=((i%8)+(i>>3))%2;
h+=`<div class="sq${d?" d":""}${i===sel?" s":""}${L.includes(i)?" m":""}" data-i="${i}">${p?`<span class="${p===p.toUpperCase()?"pw":"pk"}">${G[p.toUpperCase()]}</span>`:""}</div>`}
$("bd").innerHTML=h;tick()}
$("bd").onclick=async e=>{const el=e.target.closest(".sq");if(!el||!g)return;const i=+el.dataset.i;
if(sel!=null&&g.legal.some(m=>m[0]===sel&&m[1]===i)){const f=sel;sel=null;await post("/api/move",{code:g.id,from:f,to:i});return}
sel=g.legal.some(m=>m[0]===i)?i:null;render()};
$("rnd").onclick=async()=>{const j=await post("/api/random");if(j.wait)msg("Rakib qidirilmoqda… (boshqa o’yinchi kirishini kuting)")};
$("mk").onclick=()=>post("/api/create");
$("jn").onclick=()=>post("/api/join",{code:$("ic").value.trim()});
$("lv").onclick=()=>{post("/api/cancel");g=null;$("play").classList.add("hid");$("home").classList.remove("hid")};
</script></body></html>
